# Builds the static site (dist/) and publishes it to GitHub Pages on every push to main.
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
#
# The site works from the Pages sub-path (https://<user>.github.io/<repo>/).
#
# Network gate: the gate must be served on a SECOND origin (see README, "Deploying").
# A single Pages site is one origin, so by default the VM boots with no network.
# To enable it, serve this same dist/ on a second origin (another Pages site or a
# custom domain) and set both repository variables (Settings → Secrets and variables
# → Actions → Variables):
#   IDE_URL   e.g. https://pmalacho-mit.github.io/browser-vm/
#   GATE_URL  e.g. https://gate.example.com/
# Set both or neither; scripts/build-site.mjs refuses one without the other.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress deploy finish instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Fast checks before publishing: gate/vault unit tests (~2 s) and a headless
      # boot of the real guest image in Node (~15 s, no network needed).
      - run: npm run test:gate
      - run: npm run test:boot

      - name: Build dist/
        run: npm run build
        env:
          IDE_URL: ${{ vars.IDE_URL }}
          GATE_URL: ${{ vars.GATE_URL }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
