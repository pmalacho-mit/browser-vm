<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VM network gate</title>
<!-- The gate is the only code that may talk to the network for the VM; it needs
     to reach any site the policy allows. Nothing else may run here. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https: http:; img-src 'self' data:">
<link rel="stylesheet" href="gate.css">
</head>
<body>
  <div id="card" class="card" hidden>
    <div class="card-title">🔒 VM network gate</div>
    <div id="card-text" class="card-text"></div>
    <div class="card-actions">
      <button id="dismiss">Not now</button>
      <button id="open" class="primary">Open gate settings</button>
    </div>
  </div>
  <main id="manage" hidden></main>
  <div id="standalone" class="standalone" hidden>
    <h1>VM network gate</h1>
    <p>This page holds the secrets and network rules for the in-browser VM. Open it from the IDE
       (command <em>Linux VM: Manage Secrets &amp; Network Access</em>).</p>
  </div>
  <script src="site.js"></script><!-- generated by tools/build.mjs: deployment origins -->
  <script type="module" src="gate.js"></script>
</body>
</html>
