<!DOCTYPE html>
<!--
  First page of a preview origin (<port>-<tab>.preview.<host>). It installs the
  service worker that serves the guest's server on this origin
  (__vm_preview_sw.js), gives it a connection to the VM, then goes to the
  requested path. See host/preview/boot.ts.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Preview</title>
  <style>
    html, body { margin: 0; height: 100%; background: #fff; color: #333; font: 14px/1.5 system-ui, sans-serif; }
    body { display: grid; place-items: center; padding: 0 16px; }
    p { max-width: 32rem; text-align: center; }
    code { font: 13px ui-monospace, Menlo, monospace; }
  </style>
</head>
<body>
  <p id="status">Connecting to the VM…</p>
  <script src="boot.js"></script>
</body>
</html>
