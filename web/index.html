<!DOCTYPE html>
<!--
  The host page. Everything below runs in the visitor's browser; the server only
  hands out static files. Three things happen here:
    1. load the VS Code web workbench (Code-OSS, MIT) from ./vscode/
    2. tell it to open the folder vmfs:/root/project (a FileSystemProvider scheme)
    3. register our bridge extension (./extensions/linux-vm) as a *built-in*
       web extension so it is always present and can use proposed APIs
-->
<html>
<head>
  <meta charset="utf-8" />
  <title>Code in a Browser VM</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
  <link rel="icon" href="vscode/favicon.ico" type="image/x-icon" />
  <link data-name="vs/workbench/workbench.web.main" rel="stylesheet" href="vscode/out/vs/workbench/workbench.web.main.css">
  <style>html, body { background: #1f1f1f; margin: 0; height: 100%; }</style>
</head>
<body aria-label="">
<!-- The network gate: the VM's only way out, and the only holder of secrets (its own origin). -->
<script src="site.js"></script><!-- generated by build-site.mjs: sets GATE_URL if configured -->
<script src="gate-relay.js"></script>
<script>
  performance.mark('code/didStartRenderer');

  // Production: e.g. 'webview.example.com' if *.webview.example.com serves this site.
  const WEBVIEW_HOST = location.hostname === 'localhost' ? location.host : null;
  // Let users install editor extensions from Open VSX? Off by default: an editor
  // extension can read and change every file in the VM and use the network gate
  // (within its policy), so for users who can't vet one it's the biggest hole.
  // Ship the extensions you need as built-ins instead (additionalBuiltinExtensions).
  const ENABLE_EXTENSION_GALLERY = false;

  // Works from any path, e.g. https://you.github.io/some-repo/
  const pageBase = new URL('.', location.href);
  const vscodeBase = new URL('vscode', pageBase).toString();       // no trailing slash
  const extensionUrl = new URL('extensions/linux-vm', pageBase);

  // IWorkbenchConstructionOptions — read by vscode/out/vs/code/browser/workbench/workbench.js
  window.product = {
    productConfiguration: {
      nameShort: 'Code - OSS (Browser VM)',
      nameLong: 'Code - OSS (Browser VM)',
      applicationName: 'code-browser-vm',
      dataFolderName: '.code-browser-vm',
      // Open VSX instead of Microsoft's marketplace (whose terms forbid this use).
      // Only *web* extensions (package.json "browser" entry) can run here.
      ...(ENABLE_EXTENSION_GALLERY && { extensionsGallery: {
        serviceUrl: 'https://open-vsx.org/vscode/gallery',
        itemUrl: 'https://open-vsx.org/vscode/item',
        resourceUrlTemplate: 'https://open-vsx.org/vscode/unpkg/{publisher}/{name}/{version}/{path}',
      } }),
      // Lets our extension use the (proposed) search APIs for Ctrl+P / Find in Files.
      extensionEnabledApiProposals: {
        'local.linux-vm': ['fileSearchProvider', 'textSearchProvider'],
      },
    },
    // Webviews (Markdown preview, extension UIs) run in iframes on their own
    // origin: https://<hash>.<webview host>/. The bootstrap page refuses to run
    // anywhere else, so self-hosting them needs a wildcard hostname that serves
    // these same static files. `*.localhost` works out of the box in browsers;
    // in production set WEBVIEW_HOST (wildcard DNS + TLS cert), or leave it null
    // to fall back to Microsoft's CDN copy (*.vscode-cdn.net).
    webviewEndpoint: WEBVIEW_HOST
      ? `${location.protocol}//{{uuid}}.${WEBVIEW_HOST}${pageBase.pathname}vscode/out/vs/workbench/contrib/webview/browser/pre`
      : undefined,
    folderUri: { scheme: 'vmfs', path: '/root/project' },
    additionalBuiltinExtensions: [{
      scheme: extensionUrl.protocol.replace(':', ''),
      authority: extensionUrl.host,
      path: extensionUrl.pathname,
    }],
    configurationDefaults: {
      'workbench.colorTheme': 'Default Dark Modern',
      'workbench.startupEditor': 'none',
      'terminal.integrated.defaultProfile.linux': 'Linux VM',
      'terminal.integrated.defaultProfile.osx': 'Linux VM',
      'terminal.integrated.defaultProfile.windows': 'Linux VM',
      'security.workspace.trust.enabled': false,
      'extensions.ignoreRecommendations': true,
      'linuxVm.gateChannel': window.__vmGateChannel,
    },
  };

  // AMD loader config (copied from Code-OSS's workbench.html)
  window.__vscodeBase = vscodeBase;
</script>
<script src="vscode/out/vs/loader.js"></script>
<script src="vscode/out/vs/webPackagePaths.js"></script>
<script>
  Object.keys(self.webPackagePaths).forEach((key) => {
    self.webPackagePaths[key] = `${__vscodeBase}/node_modules/${key}/${self.webPackagePaths[key]}`;
  });
  require.config({
    baseUrl: `${__vscodeBase}/out`,
    recordStats: true,
    trustedTypesPolicy: window.trustedTypes?.createPolicy('amdLoader', {
      createScriptURL(value) {
        if (value.startsWith(window.location.origin)) return value;
        throw new Error(`Invalid script url: ${value}`);
      },
    }),
    paths: self.webPackagePaths,
  });
  performance.mark('code/willLoadWorkbenchMain');
</script>
<script src="vscode/out/vs/workbench/workbench.web.main.nls.js"></script>
<script src="vscode/out/vs/workbench/workbench.web.main.js"></script>
<script src="vscode/out/vs/code/browser/workbench/workbench.js"></script>
</body>
</html>
