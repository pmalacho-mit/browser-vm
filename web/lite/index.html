<!DOCTYPE html>
<!--
  The lightweight frontend: a file tree, an editor (CodeMirror) and a terminal
  (xterm.js) on the same VM runtime the VS Code page uses. About 1 MB of
  JavaScript instead of VS Code's ~20 MB, and an example of bringing your own
  editor: everything below talks to the runtime through its protocol
  (runtime/src/runtime.ts), nothing else.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Browser VM Lite</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="lite.css"><!-- xterm.js's styles, bundled by esbuild -->
  <style>
    /* Layout: a header strip over a three-pane workspace (tree | editor, terminal below). */
    :root {
      --bg: #16181d;
      --panel: #1c1f26;
      --line: #2a2f3a;
      --text: #d4d7de;
      --muted: #8a91a0;
      --accent: #5fb3a1;
      --warn: #d9a54c;
      --ui: system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      color-scheme: dark;
    }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 var(--ui); }
    body { display: grid; grid-template-rows: auto 1fr; }
    header {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 6px max(12px, env(safe-area-inset-right, 0px)) 6px max(12px, env(safe-area-inset-left, 0px));
      border-bottom: 1px solid var(--line); background: var(--panel);
    }
    header h1 { font-size: 13px; font-weight: 600; margin: 0; letter-spacing: .02em; }
    header .where { color: var(--muted); font-family: var(--mono); font-size: 12px; }
    header .spacer { flex: 1; }
    header a { color: var(--accent); text-decoration: none; }
    header a:hover, header a:focus-visible { text-decoration: underline; }
    .pill { font-family: var(--mono); font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
    .pill[data-state="running"] { color: var(--accent); border-color: var(--accent); }
    .pill[data-state="booting"], .pill[data-state="starting"] { color: var(--warn); border-color: var(--warn); }
    main { display: grid; grid-template-columns: 220px 1fr; grid-template-rows: 1fr 40%; min-height: 0; }
    #tree { grid-row: 1 / 3; overflow: auto; border-right: 1px solid var(--line); padding-block: 6px; font-family: var(--mono); font-size: 12px; }
    #tree ul { list-style: none; margin: 0; padding-left: 12px; }
    #tree > ul { padding-left: 4px; }
    #tree button {
      all: unset; box-sizing: border-box; display: block; width: 100%; padding: 2px 6px; border-radius: 3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;
    }
    #tree button:hover { background: var(--line); }
    #tree button:focus-visible { outline: 1px solid var(--accent); }
    #tree button[aria-current="true"] { background: var(--line); color: #fff; }
    #tree .dir::before { content: "▸ "; color: var(--muted); }
    #tree .dir[aria-expanded="true"]::before { content: "▾ "; }
    #tree .file::before { content: "  "; white-space: pre; }
    #editor-pane { display: grid; grid-template-rows: auto 1fr; min-height: 0; min-width: 0; }
    #tabbar { display: flex; align-items: center; gap: 8px; padding: 4px 10px; border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 12px; color: var(--muted); min-height: 20px; }
    #tabbar .dirty { color: var(--warn); }
    #tabbar .hint { margin-left: auto; }
    #editor { min-height: 0; overflow: hidden; }
    #editor .cm-editor { height: 100%; }
    #editor .empty { padding: 24px; color: var(--muted); }
    #terminal { border-top: 1px solid var(--line); padding: 4px 0 0 6px; min-height: 0; min-width: 0; background: #000; }
    @media (max-width: 640px) {
      main { grid-template-columns: 1fr; grid-template-rows: 25% 1fr 35%; }
      #tree { grid-row: auto; border-right: 0; border-bottom: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <header>
    <h1>Browser VM <span class="where">lite</span></h1>
    <span class="where" id="title"></span>
    <span class="pill" id="state" data-state="starting">starting</span>
    <span class="spacer"></span>
    <a id="full" href="../">Open in VS Code</a>
  </header>
  <main>
    <nav id="tree" aria-label="Files in /root/project"></nav>
    <section id="editor-pane">
      <div id="tabbar"><span id="path">no file open</span><span class="dirty" id="dirty" hidden>● unsaved</span><span class="hint">Ctrl+S saves</span></div>
      <div id="editor"><p class="empty">Pick a file on the left. Files you save here are the files the guest sees.</p></div>
    </section>
    <section id="terminal" aria-label="Terminal (ttyS0)"></section>
  </main>
  <script src="../site.js"></script>
  <script src="../gate-relay.js"></script>
  <script src="../runtime-host.js"></script>
  <script src="lite.js"></script>
</body>
</html>
